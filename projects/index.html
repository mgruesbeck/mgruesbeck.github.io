*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; }
body { margin: 0; }
img { display: block; max-width: 100%; }
ul { list-style: none; margin: 0; padding: 0; }
h1, h2, p, pre { margin: 0; }

:root { --bg: #fafafa; --ink: #383a42; --muted: #a0a1a7; --rule: #e5e5e6; --accent: #e45649; --green: #50a14f; --blue: #4078f2; --violet: #a626a4; --cyan: #0184bc; --mono: "Martian Mono", monospace; }
body { background: var(--bg); color: var(--ink); font: 400 13.5px/1.75 var(--mono); font-stretch: 87.5%; }
a { color: var(--cyan); text-decoration: none; transition: color .15s; } a:hover { color: var(--violet); }
.tm { max-width: 820px; margin: 0 auto; padding: 12vh 20px; }
.p { margin-top: 44px; color: var(--muted); } .p:first-child { margin-top: 0; }
.p .cmd { color: var(--ink); }
.u { color: var(--green); } .w { color: var(--blue); } .ar { color: var(--green); }
.o { margin-top: 8px; } .o > p + p { margin-top: 10px; }
.dim { color: var(--muted); }

.lock label { display: flex; flex-wrap: wrap; gap: 0 1ch; align-items: baseline; }
.lock input { all: unset; flex: 1; min-width: 8ch; caret-color: var(--accent); color: var(--ink); -webkit-text-security: disc; }
.lock .err { color: var(--accent); }
.lock .busy { color: var(--muted); }

.list li { border-top: 1px solid var(--rule); } .list li:first-child { border-top: 0; }
.list a { display: flex; justify-content: space-between; gap: 18px; padding: 11px 0; color: var(--ink); }
.list li:first-child a { padding-top: 0; }
.list .t { display: block; transition: color .15s; } .list a:hover .t, .list a:focus-visible .t { color: var(--violet); }
.list .s { display: block; color: var(--muted); font-size: .88em; margin-top: 1px; }
.list .m { color: var(--blue); font-size: .88em; white-space: nowrap; }

h1 { font-size: clamp(22px, 4vw, 30px); font-weight: 600; font-stretch: 100%; color: #202227; letter-spacing: -0.02em; line-height: 1.3; }
.doc > * + * { margin-top: 12px; }
.doc h2 { margin-top: 32px; font-size: 1em; font-weight: 600; color: var(--ink); }
.doc h2 .sy { color: #c5c6cb; font-weight: 400; }
.doc p { color: var(--muted); max-width: 62ch; }
.doc pre { white-space: pre-wrap; font: inherit; font-size: .92em; color: var(--green); padding-left: 14px; border-left: 1px solid var(--rule); }
.gal { display: grid; gap: 8px; grid-template-columns: repeat(var(--n, 1), minmax(0, 1fr)); align-items: start; }
.gal button { all: unset; display: block; cursor: zoom-in; border-radius: 6px; overflow: hidden; background: var(--rule); }
.gal button:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
.gal img { width: 100%; height: auto; opacity: 0; transition: opacity .3s; }
.gal:not([style*="--n:1"]) img { aspect-ratio: 1; object-fit: cover; }
.gal img.in { opacity: 1; }
.nav { margin-top: 44px; color: var(--muted); }

.viewer { width: fit-content; max-width: calc(100vw - 32px); max-height: none; padding: 0; border: 1px solid var(--rule); border-radius: 10px; background: var(--bg); box-shadow: 0 24px 70px rgba(56,58,66,.28); overflow: hidden; }
.viewer::backdrop { background: rgba(250,250,250,.78); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.viewer:focus { outline: none; }
.viewer img { width: auto; height: auto; max-width: calc(100vw - 34px); max-height: calc(100vh - 100px); cursor: zoom-out; }
.viewer .cap { width: 0; min-width: 100%; padding: 9px 12px; font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<body>
<main class="tm">
  <noscript><p class="dim">This page needs JavaScript to unlock.</p></noscript>
  <div id="app"></div>
</main>
<dialog class="viewer" aria-label="Photo" tabindex="-1"><img alt=""><p class="cap"></p></dialog>
<script>
(() => {
  const app = document.getElementById('app');
  const prompt = (cmd) => `<p class="p"><span class="u">mgruesbeck</span> <span class="w">~</span> <span class="ar">❯</span> <span class="cmd">${cmd}</span></p>`;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let key = null, data = null;

  const open = async (name) => {
    const buf = new Uint8Array(await (await fetch(`vault/${name}.bin`)).arrayBuffer());
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
  };
  const unlock = async (raw) => {
    key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    data = JSON.parse(new TextDecoder().decode(await open('index')));
  };
  const remember = (raw) => { try { sessionStorage.setItem('projects-key', btoa(String.fromCharCode(...raw))); } catch (e) {} };
  const recall = () => { try { const s = sessionStorage.getItem('projects-key'); return s && Uint8Array.from(atob(s), (c) => c.charCodeAt(0)); } catch (e) { return null; } };

  function lockScreen() {
    app.innerHTML = prompt('sudo ls projects/') + `<form class="o lock"><label>[sudo] password for mgruesbeck: <input type="password" autocomplete="current-password" aria-label="Password" autofocus></label><p class="err" hidden>Sorry, try again.</p><p class="busy" hidden>…</p></form>` + `<p class="nav"><a href="../">cd ~</a></p>`;
    const form = app.querySelector('form'), input = form.querySelector('input');
    input.focus();
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      form.querySelector('.err').hidden = true; form.querySelector('.busy').hidden = false;
      try {
        const meta = await (await fetch('vault/meta.json')).json();
        const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(input.value), 'PBKDF2', false, ['deriveBits']);
        const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: Uint8Array.from(atob(meta.salt), (c) => c.charCodeAt(0)), iterations: meta.iter }, base, 512));
        const raw = bits.slice(0, 32);
        await unlock(raw);
        remember(raw);
        route();
      } catch (err) {
        form.querySelector('.busy').hidden = true; form.querySelector('.err').hidden = false;
        input.value = ''; input.focus();
      }
    });
  }

  function list() {
    document.title = 'Projects · Melvin Gruesbeck';
    app.innerHTML = prompt('ls projects/') + `<div class="o"><ul class="list">` +
      data.projects.map((p) => `<li><a href="#${esc(p.slug)}"><span><span class="t">${esc(p.title)}</span><span class="s">${esc(p.summary)}</span></span><span class="m">${esc(p.year)}</span></a></li>`).join('') +
      `</ul></div><p class="nav"><a href="../">cd ~</a> · <a href="#" data-logout>logout</a></p>`;
  }

  function project(p) {
    document.title = `${p.title} · Projects`;
    const body = p.blocks.map((b) => {
      if (b.t === 'h') return `<h2><span class="sy">##</span> ${esc(b.text)}</h2>`;
      if (b.t === 'p') return `<p>${b.html}</p>`;
      if (b.t === 'pre') return `<pre>${esc(b.text)}</pre>`;
      const n = b.items.length === 1 ? 1 : b.items.length === 2 || b.items.length === 4 ? 2 : 3;
      return `<div class="gal" style="--n:${n}">` + b.items.map((it) => `<button type="button" aria-label="${esc(it.alt)}"><img data-id="${it.id}" width="${it.w}" height="${it.h}" alt="${esc(it.alt)}"></button>`).join('') + `</div>`;
    }).join('');
    app.innerHTML = prompt(`cat ${esc(p.slug)}.md`) + `<div class="o doc"><h1>${esc(p.title)}</h1>${body}</div><p class="nav"><a href="#">cd ..</a></p>`;
    scrollTo(0, 0);
    lazy();
  }

  // decrypt each photo as it nears the viewport
  let io;
  function lazy() {
    io && io.disconnect();
    io = new IntersectionObserver((es) => es.forEach(async (e) => {
      if (!e.isIntersecting) return;
      const img = e.target; io.unobserve(img);
      try {
        img.src = URL.createObjectURL(new Blob([await open(img.dataset.id)], { type: 'image/jpeg' }));
        img.onload = () => img.classList.add('in');
      } catch (err) { img.alt = 'Could not load'; }
    }), { rootMargin: '800px 0px' });
    app.querySelectorAll('img[data-id]').forEach((img) => io.observe(img));
  }

  const dlg = document.querySelector('.viewer'), vimg = dlg.querySelector('img');
  app.addEventListener('click', (e) => {
    if (e.target.closest('[data-logout]')) { e.preventDefault(); try { sessionStorage.removeItem('projects-key'); } catch (err) {} key = data = null; history.replaceState(null, '', location.pathname); lockScreen(); return; }
    const b = e.target.closest('.gal button'); const img = b && b.querySelector('img');
    if (!img || !img.src) return;
    vimg.src = img.src; vimg.alt = img.alt; dlg.querySelector('.cap').textContent = img.alt;
    dlg.showModal(); dlg.focus();
  });
  dlg.addEventListener('click', () => dlg.close());

  function route() {
    if (!data) return lockScreen();
    const p = data.projects.find((x) => '#' + x.slug === location.hash);
    p ? project(p) : list();
  }
  addEventListener('hashchange', route);

  const saved = recall();
  (saved ? unlock(saved).catch(() => { key = data = null; }) : Promise.resolve()).then(route);
})();
</script>
</body>
